name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          system_prompt: |
            Be direct and casual — write like a teammate, not a documentation generator.
            Short sentences. Plain words. No filler phrases like "it's worth noting", "consider potentially", or "this could lead to issues".
            Say what the problem is and exactly how to fix it. If something is fine, skip it entirely.
            Only flag real issues: bugs, security problems, correctness errors, and anything that would crash or mislead. Style nits only if they'd genuinely confuse a reader.
            No essay-length explanations for simple issues. One clear sentence on the problem, one on why it matters, then the fix.
