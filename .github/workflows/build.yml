name: Build

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Override Gradle JDK path
        run: sed -i "s|org.gradle.java.home=.*|org.gradle.java.home=$JAVA_HOME|" android/gradle.properties

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 << 'EOF'
          import base64, os, json
          encoded = os.environ.get('GOOGLE_SERVICES_JSON', '').strip()
          if not encoded:
            print("ERROR: GOOGLE_SERVICES_JSON secret is not set or empty")
            exit(1)
          try:
            decoded = base64.b64decode(encoded)
            json.loads(decoded)
          except (ValueError, json.JSONDecodeError) as e:
            print(f"ERROR: Invalid base64 or JSON: {e}")
            exit(1)
          with open('android/app/google-services.json', 'wb') as f:
            f.write(decoded)
          print("google-services.json injected successfully")
          EOF

      - run: flutter pub get

      - run: dart run build_runner build

      - run: flutter build apk --debug

  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - run: flutter pub get

      - run: dart run build_runner build

      - run: flutter build web --dart-define=USE_EMULATOR=false
