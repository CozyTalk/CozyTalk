name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  flutter-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Override Gradle JDK path
        run: sed -i "s|org.gradle.java.home=.*|org.gradle.java.home=$JAVA_HOME|" android/gradle.properties

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true

      - run: flutter pub get

      - run: dart run build_runner build

      - name: Check generated files are up to date
        run: git diff --exit-code

      - name: Auto-format Dart code
        if: github.event_name == 'pull_request'
        run: |
          dart format .
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: auto-format Dart code [skip ci]"
            git push
          fi

      - name: Format check
        run: dart format --set-exit-if-changed .

      - run: flutter analyze --no-fatal-infos

      - run: flutter test --coverage

      - uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          files: apps/mobile/coverage/lcov.info
          fail_ci_if_error: false

  functions-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - name: Start Firebase emulators
        working-directory: .
        env:
          FIREBASE_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          npx -y firebase-tools emulators:start \
            --only auth,firestore,database,functions,pubsub \
            --project cozytalk-5d984 &
          echo $! > /tmp/emulator.pid
          for port in 9099 8080 9000 5001 8085; do
            for i in $(seq 1 90); do
              nc -z localhost "$port" 2>/dev/null && break
              [ "$i" -eq 90 ] && echo "Timeout waiting for emulator port $port" && exit 1
              sleep 1
            done
          done

      - name: Jest integration tests
        run: npm test

      - name: Stop emulators
        if: always()
        run: kill "$(cat /tmp/emulator.pid)" 2>/dev/null || true
