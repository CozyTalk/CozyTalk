    - assets/images/backgrounds/DressUpBg.png
    - assets/images/backgrounds/MoodBg.png
    - assets/images/backgrounds/kao_tapu.png
    - assets/images/backgrounds/lumphini_park.png
    - assets/images/backgrounds/red_lotus_lake.png
    - assets/images/backgrounds/sea_of_cloud.png
    - assets/images/icons/Setting.svg
