<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CozyTalk – GIF Button Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #2e2320;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      gap: 32px;
      flex-wrap: wrap;
      padding: 32px 16px;
    }

    /* ── Phone frame ───────────────────────────── */
    .phone {
      width: 360px;
      height: 680px;
      background: #f0e8e0;
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ── Chat message list ──────────────────────── */
    .msg-list {
      flex: 1;
      overflow-y: auto;
      padding: 14px 14px 6px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #f0e8e0;
    }
    .bubble {
      display: flex;
      align-items: flex-end;
      gap: 6px;
    }
    .bubble.me { flex-direction: row-reverse; }
    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: #c8a882;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .bubble-text {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
      max-width: 200px;
    }
    .bubble.other .bubble-text { background: #dcebce; }
    .bubble.me    .bubble-text { background: #f1cee4; }
    .time { font-size: 10px; color: #999; flex-shrink: 0; }

    /* GIF message bubble */
    .gif-bubble {
      display: flex;
      align-items: center;
      flex-direction: column;
      gap: 4px;
    }
    .gif-label {
      font-weight: 800;
      font-size: 15px;
      color: #4a3228;
    }
    .gif-badge-sm {
      background: #eac163;
      border-radius: 5px;
      padding: 1px 6px;
      font-size: 10px;
      font-weight: 700;
      color: #4a3228;
      letter-spacing: 0.5px;
    }

    /* ── Input bar ──────────────────────────────── */
    .input-bar {
      background: #6b5e5b;
      padding: 10px 14px 20px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    .input-wrap {
      flex: 1;
      position: relative;
    }
    .input-field {
      width: 100%;
      background: white;
      border: none;
      border-radius: 22px;
      padding: 11px 52px 11px 16px;
      font-size: 14px;
      color: #333;
      outline: none;
      font-family: inherit;
    }
    .input-field::placeholder { color: #aaa; }
    .gif-badge-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: #eac163;
      border-radius: 6px;
      padding: 3px 7px;
      font-size: 11px;
      font-weight: 900;
      color: #4a3228;
      letter-spacing: 0.5px;
      cursor: pointer;
      user-select: none;
      transition: opacity .15s;
    }
    .gif-badge-btn:active { opacity: 0.7; }
    .send-btn {
      width: 46px; height: 46px;
      background: #eac163;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .send-btn svg { width: 22px; height: 22px; fill: #4a3228; }

    /* ── GIF Picker sheet ───────────────────────── */
    .sheet-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      z-index: 10;
      transition: opacity .25s;
    }
    .sheet-overlay.hidden { opacity: 0; pointer-events: none; }

    .gif-sheet {
      background: #4a3e3b;
      border-radius: 22px 22px 0 0;
      padding: 10px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transform: translateY(0);
      transition: transform .25s;
      max-height: 60%;
    }
    .sheet-handle {
      width: 34px; height: 4px;
      background: rgba(255,255,255,0.3);
      border-radius: 2px;
      margin: 0 auto 2px;
    }
    .sheet-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .gif-tag {
      background: #eac163;
      border-radius: 7px;
      padding: 3px 10px;
      font-size: 13px;
      font-weight: 900;
      color: #4a3228;
      letter-spacing: 1px;
    }
    .sheet-search {
      flex: 1;
      background: rgba(255,255,255,0.12);
      border: none;
      border-radius: 18px;
      padding: 7px 14px 7px 32px;
      color: white;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      position: relative;
    }
    .sheet-search::placeholder { color: rgba(255,255,255,0.4); }
    .search-wrap {
      flex: 1;
      position: relative;
    }
    .search-icon {
      position: absolute;
      left: 10px; top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      pointer-events: none;
    }

    .gif-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      overflow-y: auto;
      max-height: 240px;
    }
    .gif-cell {
      border-radius: 11px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: transform .12s;
    }
    .gif-cell:active { transform: scale(0.93); }
    .gif-cell .lbl { font-weight: 800; font-size: 14px; color: #4a3228; }
    .gif-cell .tag {
      background: rgba(0,0,0,0.12);
      border-radius: 5px;
      padding: 1px 5px;
      font-size: 9px;
      font-weight: 700;
      color: #4a3228;
      letter-spacing: 0.5px;
    }

    /* label */
    .section-label {
      color: rgba(255,255,255,0.55);
      font-size: 11px;
      text-align: center;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- Screen 1: Input bar with GIF button -->
  <div>
    <p style="color:#d4b896;text-align:center;margin-bottom:10px;font-size:13px;">① GIF badge inside text field</p>
    <div class="phone">
      <div class="msg-list">
        <div class="bubble other">
          <div class="avatar">🐱</div>
          <div class="bubble-text">Hello! 👋</div>
          <span class="time">10:00 pm</span>
        </div>
        <div class="bubble me">
          <span class="time">10:01 pm</span>
          <div class="bubble-text">Hello 🍪🙏🔥</div>
          <div class="avatar">🧑</div>
        </div>
        <!-- GIF message bubble -->
        <div class="bubble me">
          <span class="time">10:02 pm</span>
          <div class="bubble-text" style="background:#f1cee4;">
            <div class="gif-bubble">
              <span class="gif-label">Wave</span>
              <span class="gif-badge-sm">GIF</span>
            </div>
          </div>
          <div class="avatar">🧑</div>
        </div>
        <div class="bubble me">
          <span class="time">10:03 pm</span>
          <div class="bubble-text" style="background:#f1cee4;">
            <div class="gif-bubble">
              <span class="gif-label">LOL</span>
              <span class="gif-badge-sm">GIF</span>
            </div>
          </div>
          <div class="avatar">🧑</div>
        </div>
      </div>

      <div class="input-bar">
        <div class="input-wrap">
          <input class="input-field" placeholder="Type here ..." id="inp1" />
          <div class="gif-badge-btn" onclick="toggleSheet()">GIF</div>
        </div>
        <div class="send-btn">
          <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
        </div>
      </div>

      <!-- GIF picker sheet -->
      <div class="sheet-overlay hidden" id="sheet" onclick="closeSheet(event)">
        <div class="gif-sheet" onclick="e => e.stopPropagation()">
          <div class="sheet-handle"></div>
          <div class="sheet-header">
            <div class="gif-tag">GIF</div>
            <div class="search-wrap">
              <span class="search-icon">🔍</span>
              <input class="sheet-search" placeholder="Search GIFs..." id="searchBox" oninput="filterGifs(this.value)" />
            </div>
          </div>
          <div class="gif-grid" id="gifGrid"></div>
          <div class="section-label">Tap a GIF to send</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Screen 2: Picker open -->
  <div>
    <p style="color:#d4b896;text-align:center;margin-bottom:10px;font-size:13px;">② GIF picker bottom sheet</p>
    <div class="phone">
      <div class="msg-list">
        <div class="bubble other">
          <div class="avatar">🐱</div>
          <div class="bubble-text">Hello! 👋</div>
          <span class="time">10:00 pm</span>
        </div>
        <div class="bubble me">
          <span class="time">10:01 pm</span>
          <div class="bubble-text">Hello 🍪🙏🔥</div>
          <div class="avatar">🧑</div>
        </div>
      </div>
      <div class="input-bar">
        <div class="input-wrap">
          <input class="input-field" placeholder="Type here ..." />
          <div class="gif-badge-btn">GIF</div>
        </div>
        <div class="send-btn">
          <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
        </div>
      </div>
      <!-- Sheet always open for preview -->
      <div class="sheet-overlay" style="pointer-events:none;">
        <div class="gif-sheet">
          <div class="sheet-handle"></div>
          <div class="sheet-header">
            <div class="gif-tag">GIF</div>
            <div class="search-wrap">
              <span class="search-icon">🔍</span>
              <input class="sheet-search" placeholder="Search GIFs..." disabled />
            </div>
          </div>
          <div class="gif-grid" id="staticGrid"></div>
        </div>
      </div>
    </div>
  </div>

<script>
  const gifs = [
    { label: 'Wave',  color: '#FFD1DC' },
    { label: 'LOL',   color: '#D1F0FF' },
    { label: 'Wow',   color: '#D4FFD1' },
    { label: 'Sad',   color: '#E8D1FF' },
    { label: 'Fire',  color: '#FFE5D1' },
    { label: 'Love',  color: '#FFD1D1' },
    { label: 'Win',   color: '#FFF9D1' },
    { label: 'Cute',  color: '#D1FFEC' },
    { label: 'Hype',  color: '#FFD1F5' },
    { label: 'Sleep', color: '#D1E4FF' },
    { label: 'OMG',   color: '#FFECD1' },
    { label: 'Cool',  color: '#D1FFF9' },
  ];

  function renderGrid(container, items) {
    container.innerHTML = '';
    items.forEach(g => {
      const cell = document.createElement('div');
      cell.className = 'gif-cell';
      cell.style.background = g.color;
      cell.innerHTML = `<span class="lbl">${g.label}</span><span class="tag">GIF</span>`;
      cell.onclick = () => { closeSheet(); };
      container.appendChild(cell);
    });
  }

  renderGrid(document.getElementById('gifGrid'), gifs);
  renderGrid(document.getElementById('staticGrid'), gifs);

  function toggleSheet() {
    document.getElementById('sheet').classList.toggle('hidden');
    if (!document.getElementById('sheet').classList.contains('hidden')) {
      document.getElementById('searchBox').focus();
    }
  }

  function closeSheet(e) {
    if (!e || e.target === document.getElementById('sheet')) {
      document.getElementById('sheet').classList.add('hidden');
    }
  }

  function filterGifs(q) {
    const filtered = q.trim() === '' ? gifs : gifs.filter(g => g.label.toLowerCase().includes(q.toLowerCase()));
    renderGrid(document.getElementById('gifGrid'), filtered);
  }
</script>
</body>
</html>
